name: Grogu
options:
  bundleIdPrefix: dev.grogu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  GroguApp:
    type: application
    platform: iOS
    sources:
      - path: GroguApp
      - path: Shared
    dependencies:
      - framework: Frameworks/IDevice.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GROGU_BUNDLE_PREFIX).app"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GroguApp/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  GroguRunner:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GroguRunner
      - path: Shared
    dependencies:
      - target: GroguApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GROGU_BUNDLE_PREFIX).runner"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: GroguRunner/GroguRunner-Bridging-Header.h
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "GroguRunner serves loopback automation RPC to GroguApp on 127.0.0.1."
        TEST_HOST: ""
    postBuildScripts:
      - name: "Strip unnecessary XCTest frameworks"
        script: |
          RUNNER_APP="${BUILT_PRODUCTS_DIR}/GroguRunner-Runner.app"
          echo "Stripping bloat XCTest frameworks from ${RUNNER_APP}..."
          rm -rf "${RUNNER_APP}/Frameworks/XCTAutomationSupport.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCTest.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCTestCore.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCTestSupport.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCUIAutomation.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCUnit.framework"
          rm -rf "${RUNNER_APP}/Frameworks/Testing.framework"
          rm -f  "${RUNNER_APP}/Frameworks/libXCTestSwiftSupport.dylib"
          rmdir  "${RUNNER_APP}/Frameworks" 2>/dev/null || true

schemes:
  Grogu:
    build:
      targets:
        GroguApp: all
        GroguRunner: [test]
    test:
      targets:
        - GroguRunner
      testPlans: []
