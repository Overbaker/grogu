<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="Grogu dual-mode architecture: Linux Tailscale Gateway + Worker and Standalone On-Device Swift 6 iOS App">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1200" height="410" rx="18" fill="#0B101B" stroke="#24324B" stroke-width="1.5"/>
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">Two Deployment Modes — Same Native iOS Control Stack</text>
  <text x="40" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Run remotely from any Linux Tailscale host OR run 100% standalone on the iPhone / iPad itself</text>

  <!-- MODE A: Remote Linux Host over Tailscale -->
  <rect x="36" y="88" width="1128" height="142" rx="14" fill="#101829" stroke="#253655" stroke-width="1.5"/>
  <rect x="52" y="102" width="284" height="24" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-opacity="0.5"/>
  <text x="194" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#93C5FD">MODE A · LINUX TAILSCALE HOST (NO MAC)</text>

  <rect x="52" y="140" width="210" height="74" rx="10" fill="#162138" stroke="#334155"/>
  <text x="157" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">LLM / MCP Client &amp; Siri</text>
  <text x="157" y="192" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">stdio · HTTP :18831 · Shortcuts</text>

  <line x1="266" y1="177" x2="314" y2="177" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrBlue)"/>

  <rect x="322" y="140" width="244" height="74" rx="10" fill="#162138" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="444" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC">grogu-gateway + Decision API</text>
  <text x="444" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">FastWDA · AI UI Router · :18830</text>

  <line x1="570" y1="177" x2="618" y2="177" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrBlue)"/>

  <rect x="626" y="140" width="234" height="74" rx="10" fill="#162138" stroke="#334155"/>
  <text x="743" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">grogu-worker</text>
  <text x="743" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">UserspaceRsdTunnel · DVT RPC</text>

  <line x1="864" y1="177" x2="942" y2="177" stroke="#38BDF8" stroke-width="2.2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="903" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#67E8F9">Tailscale</text>
  <text x="903" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">MTU 1280</text>

  <rect x="950" y="140" width="198" height="74" rx="10" fill="#13262E" stroke="#10B981" stroke-width="1.5"/>
  <text x="1049" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC">iPhone / iPad</text>
  <text x="1049" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6EE7B7">DVT + Optional WDA</text>

  <!-- MODE B: Standalone On-Device Swift 6 App -->
  <rect x="36" y="246" width="1128" height="142" rx="14" fill="#101829" stroke="#253655" stroke-width="1.5"/>
  <rect x="52" y="260" width="276" height="24" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="190" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#6EE7B7">MODE B · STANDALONE ON-DEVICE (SWIFT 6)</text>

  <rect x="52" y="298" width="256" height="74" rx="10" fill="#162138" stroke="#334155"/>
  <text x="180" y="324" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Remote Agents / MCP Servers</text>
  <text x="180" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">Claude Code · Antigravity · Cursor</text>

  <line x1="312" y1="335" x2="394" y2="335" stroke="#10B981" stroke-width="2.2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="353" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7">2-Way MCP</text>
  <text x="353" y="353" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">:18832/mcp</text>

  <rect x="402" y="298" width="356" height="74" rx="10" fill="#13262E" stroke="#10B981" stroke-width="1.5"/>
  <text x="580" y="324" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC">GroguApp (Pure Swift 6 On-Device)</text>
  <text x="580" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#CBD5E1">Native OS Tools · LocalDevVPN DDI · Keychain Auth</text>

  <line x1="762" y1="335" x2="816" y2="335" stroke="#10B981" stroke-width="2" marker-end="url(#arrGreen)"/>

  <rect x="824" y="298" width="324" height="74" rx="10" fill="#162138" stroke="#334155"/>
  <text x="986" y="324" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">GroguRunner (127.0.0.1:18831)</text>
  <text x="986" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">~50ms HID Gestures · A11y Tree · Vision OCR</text>
</svg>
