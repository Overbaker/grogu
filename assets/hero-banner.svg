      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="55%" stop-color="#10192B"/>
      <stop offset="100%" stop-color="#0C1C26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
