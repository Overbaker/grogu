<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Grogu (grogu-ios): Control unjailbroken iOS and iPadOS natively over Tailscale or on-device with CoreDevice/DVT telemetry, FastWDA UI trees, Siri takeover, and bidirectional MCP server">
